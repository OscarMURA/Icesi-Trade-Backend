# Configuración de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# El dialecto se detecta automáticamente según el driver de la base de datos
# Si usas H2, descomenta la siguiente línea:
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Si usas PostgreSQL, descomenta la siguiente línea:
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always

# Habilitar consola H2 (solo si usas H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG


spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.servlet.multipart.enabled=true

# ============== EMAIL CONFIGURATION (GMAIL) ==============
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=icesi.trade@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Configuración de timeouts
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Configuración adicional para debugging
spring.mail.properties.mail.smtp.debug=false

# Configuración adicional para Gmail
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.allow8bitmime=true

# Configuración de la aplicación para emails
app.email.from=icesi.trade@gmail.com
app.email.from.name=Icesi Trade

# ============== HIKARI CP CONFIGURATION (POOL DE CONEXIONES OPTIMIZADO) ==============
# Pool de conexiones aumentado para soportar múltiples usuarios simultáneos
spring.datasource.hikari.maximum-pool-size=50
# Mantener conexiones mínimas disponibles para respuestas rápidas
spring.datasource.hikari.minimum-idle=10
# Timeout para obtener conexión del pool (aumentado para evitar rechazos)
spring.datasource.hikari.connection-timeout=60000
# Tiempo máximo que una conexión puede estar idle antes de cerrarse
spring.datasource.hikari.idle-timeout=600000
# Tiempo máximo de vida de una conexión (30 minutos)
spring.datasource.hikari.max-lifetime=1800000
# Detectar conexiones que no se cierran correctamente
spring.datasource.hikari.leak-detection-threshold=60000
# Mantener conexiones activas
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.pool-name=IcesiTradePool
# Permitir registrar métricas del pool (útil para monitoreo)
spring.datasource.hikari.register-mbeans=true
# Validar conexiones antes de usarlas (compatible con H2 y PostgreSQL)
# HikariCP detecta automáticamente la query correcta según el driver, pero puedes forzarla:
# Para H2: spring.datasource.hikari.connection-test-query=SELECT 1
# Para PostgreSQL: spring.datasource.hikari.connection-test-query=SELECT 1
# La mayoría de las veces no es necesario, HikariCP lo detecta automáticamente
# Permitir que el pool crezca más allá del mínimo idle
spring.datasource.hikari.allow-pool-suspension=false
# Validar conexiones al obtenerlas del pool
spring.datasource.hikari.validation-timeout=3000
# Configurar el comportamiento cuando no hay conexiones disponibles
spring.datasource.hikari.initialization-fail-timeout=1
# connection-init-sql solo para PostgreSQL (comentar si usas H2)
# Para PostgreSQL, descomenta la siguiente línea:
# spring.datasource.hikari.connection-init-sql=SET application_name TO 'icesi-trade-spring'
# Para H2, mantén esta línea comentada