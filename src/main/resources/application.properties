spring.application.name=icesi_trade
server.port=8080


# ============== DATABASE CONFIG (usa variables de entorno) ==============
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# ============== AZURE STORAGE ==============
spring.cloud.azure.storage.blob.connection-string=${SPRING_AZURE_CONNECTION_STRING}
spring.cloud.azure.storage.blob.container-name=${SPRING_AZURE_CONTAINER_NAME}

# ============== FRONTEND URLS ==============
app.frontend.url=http://localhost:5173
app.frontend.alternative-url=${APP_FRONTEND_ALTERNATIVE_URL}
image.base.url=${IMAGE_BASE_URL}


# Configuración de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG


spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.servlet.multipart.enabled=true


