spring.application.name=icesi_trade
server.port=8080


# ============== DATABASE CONFIG (usa variables de entorno) ==============
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# ============== AZURE STORAGE ==============
spring.cloud.azure.storage.blob.connection-string=${SPRING_AZURE_CONNECTION_STRING}
spring.cloud.azure.storage.blob.container-name=${SPRING_AZURE_CONTAINER_NAME}

# ============== FRONTEND URLS ==============
app.frontend.url=http://localhost:5173
app.frontend.alternative-url=${APP_FRONTEND_ALTERNATIVE_URL}
image.base.url=${IMAGE_BASE_URL}


# Configuración de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG


spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.servlet.multipart.enabled=true

# ============== EMAIL CONFIGURATION (GMAIL) ==============
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=icesi.trade@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Configuración de timeouts
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Configuración adicional para debugging
spring.mail.properties.mail.smtp.debug=false

# Configuración adicional para Gmail
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.allow8bitmime=true

# Configuración de la aplicación para emails
app.email.from=icesi.trade@gmail.com
app.email.from.name=Icesi Trade

# Configuración para evitar exceso de conexiones en Supabase (máx 20 conexiones activas)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000


