spring.application.name=icesi_trade
server.port=8080

# ============== SERVER CONFIGURATION (PARA MÚLTIPLES CONEXIONES) ==============
# Tamaño máximo de threads para manejar peticiones concurrentes
server.tomcat.threads.max=200
# Número mínimo de threads workers
server.tomcat.threads.min-spare=20
# Tiempo máximo de espera para aceptar conexiones
server.tomcat.accept-count=100
# Tamaño máximo de conexiones simultáneas
server.tomcat.max-connections=10000
# Timeout de conexiones Tomcat (en milisegundos)
server.tomcat.connection-timeout=60000
# Comprimir respuestas para mejor rendimiento
server.compression.enabled=true
# Comprimir respuestas mayores a este tamaño (bytes)
server.compression.min-response-size=1024

# URLs de localhost
image.base.url=http://localhost:8080/images/

# ============== DATABASE CONFIG (usa variables de entorno) ==============
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# ============== AZURE STORAGE ==============
spring.cloud.azure.storage.blob.connection-string=${SPRING_AZURE_CONNECTION_STRING}
spring.cloud.azure.storage.blob.container-name=${SPRING_AZURE_CONTAINER_NAME}

# ============== FRONTEND URLS ==============
app.frontend.url=${APP_FRONTEND_URL}
app.frontend.alternative-url=${APP_FRONTEND_ALTERNATIVE_URL}

