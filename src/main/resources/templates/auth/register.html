<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bandits-body">

<div class="bandits-container">
    <h2 class="bandits-title">Crear cuenta</h2>

    <form th:action="@{public/register}" th:object="${registerDto}" method="post" class="bandits-form">

        <label for="email">Correo</label>
        <input type="email" id="email" th:field="*{email}" required />
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="bandits-alert error"></p>

        <label for="password">Contraseña</label>
        <div class="bandits-password-wrapper">
            <input type="password" id="password" th:field="*{password}" required />
            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
        </div>
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="bandits-alert error"></p>

        <label for="confirmPassword">Confirmar contraseña</label>
        <div class="bandits-password-wrapper">
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required />
            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁️</button>
        </div>
        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="bandits-alert error"></p>

        <label for="name">Nombre</label>
        <input type="text" id="name" th:field="*{name}" required />
        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="bandits-alert error"></p>

        <label for="phone">Teléfono</label>
        <input type="text" id="phone" th:field="*{phone}" />
        <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="bandits-alert error"></p>

        <div th:if="${registrationError}" class="bandits-alert error" th:text="${registrationError}"></div>

        <button type="submit" class="bandits-submit">Registrar</button>
    </form>

    <p class="bandits-footer">
        ¿Ya tienes cuenta? <a th:href="@{public/login}">Inicia sesión</a>
    </p>
</div>

<script th:src="@{/js/register.js}"></script>
</body>
</html>
