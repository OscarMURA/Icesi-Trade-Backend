<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <h2>Crear Cuenta</h2>

    <form th:action="@{/register}" th:object="${registerDto}" method="post">
        <div>
            <label for="email">Correo:</label>
            <input type="email" id="email" th:field="*{email}" required />
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>
        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" th:field="*{password}" required />
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div>
            <label for="confirmPassword">Confirmar Contraseña:</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required />
            <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
        </div>
        <div>
            <label for="name">Nombre:</label>
            <input type="text" id="name" th:field="*{name}" required />
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>
        <div>
            <label for="phone">Teléfono:</label>
            <input type="text" id="phone" th:field="*{phone}" />
            <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
        </div>
        <div th:if="${registrationError}">
            <p style="color:red;" th:text="${registrationError}"></p>
        </div>
        <button type="submit">Registrar</button>
    </form>

    <p>
        <a th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión</a>
    </p>
</body>
</html>
