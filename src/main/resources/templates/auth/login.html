<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bandits-body">

    <div class="bandits-container">
        <h2 class="bandits-title">Iniciar sesión</h2>

        <div th:if="${param.registered}" class="bandits-alert success">
            Registro exitoso. ¡Ya puedes iniciar sesión!
        </div>

        <!-- 🔧 Cambiado /login → /public/login -->
        <form th:action="@{/public/login}" method="post" class="bandits-form">
            <label for="username">Correo</label>
            <input type="text" id="username" name="username" required />

            <label for="password">Contraseña</label>
            <div class="bandits-password-wrapper">
                <input type="password" id="password" name="password" required />
                <button type="button" class="toggle-password" id="togglePasswordBtn">👁️</button>
            </div>

            <button type="submit" class="bandits-submit">Ingresar</button>
        </form>

        <div th:if="${param.error}" class="bandits-alert error">
            Credenciales incorrectas
        </div>

        <div th:if="${param.logout}" class="bandits-alert success">
            Has cerrado sesión exitosamente
        </div>

        <p class="bandits-footer">
            ¿No tienes cuenta? <a th:href="@{/public/register}">Regístrate aquí</a>
        </p>
    </div>

    <script th:src="@{/js/login.js}"></script>
</body>
</html>
