<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Listado de Usuarios</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Usuarios registrados</h2>
    <a th:href="@{/roles}" class="btn btn-outline-secondary">Ver Roles</a>
  </div>

  <table class="table table-bordered table-hover shadow-sm">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.email}">juan@example.com</td>
        <td th:text="${u.name}">Juan Pérez</td>
        <td th:text="${u.phone}">3001234567</td>
        <td>
          <a th:href="@{'/users/' + ${u.id} + '/roles'}" class="btn btn-sm btn-primary">Asignar Roles</a>
        </td>
      </tr>
    </tbody>
  </table>

</body>
</html>
