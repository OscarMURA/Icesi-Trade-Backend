<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Asignar Roles</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar d-flex flex-column justify-content-between">
    <div>
      <h4 class="text-center fw-bold text-white mt-3 mb-4">
        <i class="fas fa-house-chimney"></i> ITrade
      </h4>
      <a class="nav-link active" th:href="@{/users}"><i class="fas fa-users"></i> Usuarios</a>
      <a class="nav-link" th:href="@{/roles}"><i class="fas fa-shield-alt"></i> Roles</a>
    </div>
    <form th:action="@{/logout}" method="post" class="logout-form">
      <button type="submit" class="sidebar-btn w-100">
        <i class="fas fa-sign-out-alt me-1"></i> Logout
      </button>
    </form>
  </div>

  <!-- Contenido principal -->
  <div class="main-content d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="bandits-container">
      <h2 class="bandits-title">Asignar Roles a Usuario</h2>
      <h5 class="text-center mb-3" th:text="${user.name} + ' (' + ${user.email} + ')'"></h5>

      <form th:action="@{'/users/' + ${user.id} + '/roles'}" method="post" class="bandits-form">
        <label class="mb-2">Roles disponibles:</label>

        <div class="form-check mb-2" th:each="role : ${roles}">
          <input class="form-check-input" type="checkbox"
                 th:id="'role-' + ${role.id}"
                 th:name="roleIds"
                 th:value="${role.id}"
                 th:checked="${assignedRoleIds.contains(role.id)}" />
          <label class="form-check-label" th:for="'role-' + ${role.id}" th:text="${role.name}"></label>
        </div>

        <div th:if="${param.error}" class="bandits-alert error">
          <p th:text="${param.error}"></p>
        </div>

        <button type="submit" class="bandits-submit">Guardar Cambios</button>
        <a th:href="@{/users}" class="btn btn-outline-secondary mt-2 w-100">Cancelar</a>
      </form>
    </div>
  </div>
</body>
</html>
