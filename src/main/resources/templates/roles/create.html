<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Crear Rol</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div id="sidebar" class="sidebar d-flex flex-column justify-content-between">
    <div>
      <h4 class="text-center fw-bold text-white mt-3 mb-4">
        <i class="fas fa-house-chimney"></i> ITrade
      </h4>
      <a class="nav-link" th:href="@{/users}"><i class="fas fa-users"></i> Usuarios</a>
      <a class="nav-link active" th:href="@{/roles}"><i class="fas fa-shield-alt"></i> Roles</a>
    </div>

    <form th:action="@{/logout}" method="post" class="logout-form">
      <button type="submit" class="sidebar-btn w-100">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </button>
    </form>
  </div>

  <div class="main-content d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="bandits-container">
      <h2 class="bandits-title">Crear Nuevo Rol</h2>

      <form th:action="@{/roles}" method="post" class="bandits-form">
        <label for="name">Nombre del Rol</label>
        <input type="text" id="name" name="name" th:value="${role.name}" required />

        <label for="description">Descripción</label>
        <input type="text" id="description" name="description" th:value="${role.description}" />

        <label class="mt-2">Permisos:</label>
        <div class="form-check mb-2" th:each="permission : ${permissions}">
          <input class="form-check-input" type="checkbox"
                 th:name="permissionIds" th:value="${permission.id}"
                 th:id="'perm-' + ${permission.id}" />
          <label class="form-check-label" th:for="'perm-' + ${permission.id}" th:text="${permission.name}"></label>
        </div>

        <div th:if="${param.error}" class="bandits-alert error">
          <p th:text="${param.error}"></p>
        </div>

        <button type="submit" class="bandits-submit">Crear Rol</button>
      </form>
    </div>
  </div>
</body>
</html>
