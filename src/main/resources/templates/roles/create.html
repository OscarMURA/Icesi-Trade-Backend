<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Rol</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="container mt-5">
    <h2 class="mb-4">Crear Nuevo Rol</h2>

    <form th:action="@{/roles}" method="post" class="border p-4 rounded bg-light">
        <div class="mb-3">
            <label for="name" class="form-label">Nombre del Rol</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${role.name}" required />
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Descripción</label>
            <textarea class="form-control" id="description" name="description" th:text="${role.description}" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Permisos:</label>
            <div class="form-check" th:each="permission : ${permissions}">
                <input class="form-check-input" type="checkbox" th:name="permissionIds"
                       th:value="${permission.id}" th:id="'perm-' + ${permission.id}" />
                <label class="form-check-label" th:for="'perm-' + ${permission.id}" th:text="${permission.name}"></label>
            </div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            <p th:text="${param.error}"></p>
        </div>

        <button type="submit" class="btn btn-primary">Crear Rol</button>
    </form>
</body>
</html>
