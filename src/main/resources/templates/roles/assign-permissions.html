<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Permisos del Rol</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="bandits-body">

  <div class="bandits-container">
    <h2 class="bandits-title">Asignar Permisos al Rol</h2>
    <h4 th:text="'Rol: ' + ${role.name}" class="text-center mb-3"></h4>

    <form th:action="@{'/roles/' + ${role.id} + '/permissions'}" method="post" class="bandits-form">
      <label class="form-label">Permisos disponibles:</label>
      <div class="form-check mb-2" th:each="perm : ${permissions}">
        <input type="checkbox" class="form-check-input"
               th:id="'perm-' + ${perm.id}"
               th:name="permissionIds"
               th:value="${perm.id}"
               th:checked="${assignedPermissionIds.contains(perm.id)}" />
        <label class="form-check-label" th:for="'perm-' + ${perm.id}" th:text="${perm.name}"></label>
      </div>

      <div th:if="${param.error}" class="bandits-alert error">
        <p th:text="${param.error}"></p>
      </div>

      <button type="submit" class="bandits-submit">Guardar Cambios</button>
      <a th:href="@{/roles}" class="btn btn-outline-secondary mt-2 w-100">Cancelar</a>
    </form>
  </div>

</body>
</html>
