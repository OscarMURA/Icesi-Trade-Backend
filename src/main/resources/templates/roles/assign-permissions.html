<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Permisos del Rol</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="container mt-5">

    <h2>Asignar Permisos al Rol</h2>
    <h4 th:text="'Rol: ' + ${role.name}"></h4>

    <form th:action="@{'/roles/' + ${role.id} + '/permissions'}" method="post" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Permisos disponibles:</label>
            <div class="form-check" th:each="perm : ${permissions}">
                <input type="checkbox" class="form-check-input"
                       th:id="'perm-' + ${perm.id}"
                       th:name="permissionIds"
                       th:value="${perm.id}"
                       th:checked="${assignedPermissionIds.contains(perm.id)}" />
                <label th:for="'perm-' + ${perm.id}" th:text="${perm.name}" class="form-check-label"></label>
            </div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            <p th:text="${param.error}"></p>
        </div>

        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a th:href="@{/roles}" class="btn btn-secondary">Cancelar</a>
    </form>

</body>
</html>
