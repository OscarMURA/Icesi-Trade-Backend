<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Permisos del Rol</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar d-flex flex-column justify-content-between">
    <div>
      <h4 class="text-center fw-bold text-white mt-3 mb-4">
        <i class="fas fa-house-chimney"></i> ITrade
      </h4>
      <a class="nav-link" th:href="@{/users}"><i class="fas fa-users"></i> Usuarios</a>
      <a class="nav-link active" th:href="@{/roles}"><i class="fas fa-shield-alt"></i> Roles</a>
    </div>

    <form th:action="@{public/logout}" method="post" class="logout-form">
      <button type="submit" class="sidebar-btn w-100">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </button>
    </form>
  </div>

  <!-- Contenido principal -->
  <div class="main-content d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="bandits-container">
      <h2 class="bandits-title">Asignar Permisos al Rol</h2>
      <h5 class="text-center mb-3" th:text="'Rol: ' + ${role.name}"></h5>

      <form th:action="@{'/roles/' + ${role.id} + '/permissions'}" method="post" class="bandits-form">
        <label class="form-label">Permisos disponibles:</label>

        <div class="form-check mb-2" th:each="perm : ${permissions}">
          <input type="checkbox" class="form-check-input"
                 th:id="'perm-' + ${perm.id}"
                 th:name="permissionIds"
                 th:value="${perm.id}"
                 th:checked="${assignedPermissionIds.contains(perm.id)}" />
          <label class="form-check-label" th:for="'perm-' + ${perm.id}" th:text="${perm.name}"></label>
        </div>

        <div th:if="${param.error}" class="bandits-alert error">
          <p th:text="${param.error}"></p>
        </div>

        <button type="submit" class="bandits-submit">Guardar Cambios</button>
        <a th:href="@{/roles}" class="btn btn-outline-secondary mt-2 w-100">Cancelar</a>
      </form>
    </div>
  </div>

  <script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
