<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Listado de Roles</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <div id="sidebar" class="sidebar d-flex flex-column justify-content-between">
    <div>
      <h4 class="text-center fw-bold text-white mt-3 mb-4">
        <i class="fas fa-house-chimney"></i> ITrade
      </h4>
      <a class="nav-link" th:href="@{/users}"><i class="fas fa-users"></i> Usuarios</a>
      <a class="nav-link active" th:href="@{/roles}"><i class="fas fa-shield-alt"></i> Roles</a>
    </div>

    <form th:action="@{public/logout}" method="post" class="logout-form">
      <button type="submit" class="sidebar-btn w-100">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </button>
    </form>    
  </div>

  <div class="main-content p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">Roles</h2>
      <div class="d-flex gap-2">
        <a th:href="@{/roles/create}" class="btn btn-success">
          <i class="fas fa-plus me-1"></i> Crear Nuevo Rol
        </a>
      </div>
    </div>

    <table class="table table-bordered table-hover shadow-sm">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="role : ${roles}">
          <td th:text="${role.id}">1</td>
          <td th:text="${role.name}">ROLE_ADMIN</td>
          <td th:text="${role.description}">Administrador con permisos totales</td>
          <td>
            <a th:href="@{'/roles/' + ${role.id} + '/permissions'}" class="btn btn-sm btn-primary">
              <i class="fas fa-pen-to-square me-1"></i> Editar Permisos
            </a>
            <form th:action="@{'/roles/delete/' + ${role.id}}" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm btn-danger"
                      onclick="return confirm('¿Estás seguro de eliminar este rol?')">
                <i class="fas fa-trash me-1"></i> Eliminar
              </button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
