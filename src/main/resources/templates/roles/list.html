<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Listado de Roles</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Gestión de Roles</h2>
    <div>
      <a th:href="@{/users}" class="btn btn-secondary">Volver a Usuarios</a>
      <a th:href="@{/roles/create}" class="btn btn-success">Crear Nuevo Rol</a>
    </div>
  </div>

  <table class="table table-bordered table-hover shadow-sm">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="role : ${roles}">
        <td th:text="${role.id}"></td>
        <td th:text="${role.name}"></td>
        <td th:text="${role.description}"></td>
        <td>
          <a th:href="@{'/roles/' + ${role.id} + '/permissions'}" class="btn btn-primary btn-sm">Editar Permisos</a>
          <form th:action="@{'/roles/delete/' + ${role.id}}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger btn-sm"
                    onclick="return confirm('¿Estás seguro de eliminar este rol?')">Eliminar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

</body>
</html>
